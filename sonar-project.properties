sonar.projectKey=Super-Morse_morse-dsp
sonar.organization=super-morse
sonar.host.url=https://sonarcloud.io

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=morse-dsp
sonar.projectVersion=1.0

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Define what to analyze (Source code)
sonar.sources=.

# Define where the test files are located
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Exclude tests, the Go toolchain's wasm_exec.js, build outputs and README screenshots from source analysis
sonar.exclusions=**/*_test.go, docs/wasm_exec.js, docs/main.wasm, docs/assets/**/*, bin/**/*

# Coverage comes from `go test`: the js/wasm bridge cannot run under it, the web UI
# is not Go, and cmd/morse-dsp/main.go only calls os.Exit(run(...)) (run is tested)
sonar.coverage.exclusions=cmd/wasm/**/*, docs/**/*, cmd/morse-dsp/main.go

# Reference code coverage report for Go
sonar.go.coverage.reportPaths=coverage.out
